# LimbusPy 封装 API（A 层）契约源 —— 唯一真源，三向生成：
#   tools/gen_contract.py → python/limbuspy/api/ops.py（类型化封装 + docstring）
#                         → kernel/LimbusPy.Ops/OpsManifest.g.cs（C# 注册表/manifest）
#                         → python/limbuspy/api/_contract_manifest.json（测试与运行时协商）
#
# 新增一个 op 的流程：在下面加一段 → 生成 → 在 C# 里实现同名方法（注册表会校验"契约有、
# 实现缺"）→ 加 fixture 测试。Python 侧的壳、文档、manifest 都不用手写。
#
# 参数类型词汇表（Python 侧映射见 api/types.py，C# 侧见 OpArgs.cs）：
#   unit           单位引用：UnitRef / 句柄 int / {"h":n} / {"instance_id":n}
#   int / float / bool / str
#   timing         BATTLE_EVENT_TIMING 成员名（字符串，如 "ON_SUCCESS_ATTACK"）
#   source         DAMAGE_SOURCE_TYPE 成员名（如 "PASSIVE"）
#   ability_source ABILITY_SOURCE_TYPE 成员名
#   buff_keyword   BUFF_UNIQUE_KEYWORD 成员名（如 "SINKING"）
#   unit_keyword   UNIT_KEYWORD 成员名

[meta]
version = "1.0"
stability = "stable"

# ======================================================================================
# 读：一次 crossing 拿扁平数据，不返回引用（避免句柄/失效类问题）
# ======================================================================================

[[op]]
name = "unit.info"
class = "UnitOps"
method = "info"
summary = "读单位的基础状态，一次 crossing 拿全。"
doc = """
返回扁平 dict（`UnitInfo`），不含任何引用：适合记账、判断、日志。

这是读状态的**首选**：比逐个读 `hp`/`max_hp`/`is_dead` 省 N-1 次往返。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
]
returns = "UnitInfo"
returns_doc = "hp/max_hp/mp/position/is_dead/is_break/faction/instance_id/origin_id"

[[op]]
name = "unit.buff_stacks"
class = "UnitOps"
method = "buff_stacks"
summary = "读某关键字 Buff 的当前层数。"
doc = """
按**主关键字**匹配（等价 Modular 的 `getbuffstack`）。没有该 buff 时返回 0，不报错。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "keyword", type = "buff_keyword", doc = "Buff 关键字，如 \"SINKING\"" },
]
returns = "int"
returns_doc = "层数（0 = 没有）"

[[op]]
name = "unit.buff_turns"
class = "UnitOps"
method = "buff_turns"
summary = "读某关键字 Buff 的剩余回合。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "keyword", type = "buff_keyword", doc = "Buff 关键字" },
]
returns = "int"
returns_doc = "剩余回合（0 = 没有）"

[[op]]
name = "unit.buffs"
class = "UnitOps"
method = "buffs"
summary = "列出单位身上的全部 Buff（扁平，无引用）。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
]
returns = "List[BuffInfo]"
returns_doc = "每项：keyword/stacks/turns/max_stacks/max_turns/name"

[[op]]
name = "unit.has_keyword"
class = "UnitOps"
method = "has_keyword"
summary = "单位是否带某个单位关键字（UNIT_KEYWORD）。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "keyword", type = "unit_keyword", doc = "单位关键字名，如 \"SINKING\"" },
]
returns = "bool"

[[op]]
name = "battle.units"
class = "BattleOps"
method = "units"
summary = "全场单位（扁平快照），按 instance_id 升序。"
doc = """
一次调用拿全场：`[UnitInfo, ...]`。要“敌人/血量最低”这类筛选，在 Python 侧对返回值做即可，
不必再逐单位往返。
"""
returns = "List[UnitInfo]"

[[op]]
name = "battle.states"
class = "BattleOps"
method = "states"
summary = "全场单位的富状态一次拿全（unit.state 的批版）。"
doc = """
**属性组**的落地：遍历一次管理器字典，每个单位多读 buff 数量与等级，全部在同一个
主线程时间片里完成。全场 11 个单位也只要 **1 次**跨进程往返，而逐个 `unit.state` 是 11 次。

这是「批量 getter」相对「逐单位读」的核心价值 —— 后者是最容易写出来的 N+1。
"""
returns = "List[UnitState]"
returns_doc = "每个单位的 UnitState（按 instance_id 升序）"

[[op]]
name = "battle.players"
class = "BattleOps"
method = "players"
summary = "我方单位的扁平快照。"
returns = "List[UnitInfo]"

[[op]]
name = "battle.enemies"
class = "BattleOps"
method = "enemies"
summary = "敌方单位的扁平快照。"
returns = "List[UnitInfo]"

[[op]]
name = "battle.damage"
class = "BattleOps"
method = "damage_many"
summary = "对一组单位同时造成伤害（N 个目标 1 次往返）。"
doc = """
逐目标调 `unit.damage` 是 N 次往返；这个 op 是 **1 次**。
单个目标解析失败不影响其它目标（返回列表里那一项 `applied=False`）。
"""
args = [
  { name = "units", type = "list_obj", doc = "目标单位引用列表" },
  { name = "amount", type = "int", doc = "伤害点数（正数）" },
  { name = "source", type = "source", doc = "伤害来源枚举名", default = "\"PASSIVE\"" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "List[UnitInfo]"

[[op]]
name = "battle.heal"
class = "BattleOps"
method = "heal_many"
summary = "对一组单位同时治疗（N 个目标 1 次往返）。"
args = [
  { name = "units", type = "list_obj", doc = "目标单位引用列表" },
  { name = "amount", type = "int", doc = "治疗点数（正数）" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "List[UnitInfo]"

# ── 随机（纯本地，不碰游戏对象）──────────────────────────────────────────────────────

[[op]]
name = "rng.int"
class = "RngOps"
method = "int"
summary = "闭区间整数随机数（独立随机源，不污染游戏 RNG）。"
args = [
  { name = "min", type = "int", doc = "下界（含）", default = "0" },
  { name = "max", type = "int", doc = "上界（含）", default = "100" },
]
returns = "int"

[[op]]
name = "rng.chance"
class = "RngOps"
method = "chance"
summary = "千分位概率判定（permille=300 即 30%）。"
args = [
  { name = "permille", type = "int", doc = "千分位概率 0..1000" },
]
returns = "bool"

[[op]]
name = "rng.pick"
class = "RngOps"
method = "pick"
summary = "从字符串列表里随机取一个（空列表返回空串）。"
args = [
  { name = "items", type = "list_str", doc = "候选列表" },
]
returns = "str"

[[op]]
name = "battle.round"
class = "BattleOps"
method = "round"
summary = "当前回合数；拿不到时返回 None。"
returns = "Optional[int]"

# ======================================================================================
# 写：原子多步。C# 侧在同一个主线程时间片里做完（读-算-写），Python 只发一条指令。
# ======================================================================================

[[op]]
name = "unit.damage"
class = "UnitOps"
method = "damage"
summary = "对单位造成伤害（内部处理 ChangeHp 的语义与枚举）。"
doc = """
**这是打伤害的唯一推荐入口。** `ChangeHp` 的 `value` 是「目标 HP 值」而不是增量、还要补齐
枚举与哨兵值——这些坑都在 C# 侧封掉了。

返回伤害后的 `UnitInfo`（省一次读）；`applied=False` 表示没有实际改动（已死/无效目标）。
"""
stability = "stable"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "amount", type = "int", doc = "伤害点数（正数）" },
  { name = "source", type = "source", doc = "伤害来源枚举名", default = "\"PASSIVE\"" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "UnitInfo"
returns_doc = "伤害后的状态"

[[op]]
name = "unit.heal"
class = "UnitOps"
method = "heal"
summary = "治疗单位（走游戏自己的回复管线，不超上限）。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "amount", type = "int", doc = "治疗点数（正数）" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "UnitInfo"
returns_doc = "治疗后的状态"

[[op]]
name = "unit.set_hp"
class = "UnitOps"
method = "set_hp"
summary = "把单位 HP 直接设为某个值（会走 OnChangeHp 通知）。"
doc = """
等价 `ChangeHp(target_hp, ...)`。扣血请优先用 `damage()`，它更不容易写错。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "hp", type = "int", doc = "目标 HP 值（不是增量）" },
  { name = "source", type = "source", doc = "伤害来源枚举名", default = "\"PASSIVE\"" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "UnitInfo"

[[op]]
name = "unit.add_passive"
class = "UnitOps"
method = "add_passive"
summary = "按被动 id 施加一个被动（最安全的“施加效果”入口）。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "passive_id", type = "int", doc = "PassiveData 的 id" },
]
returns = "bool"
returns_doc = "true = 已施加"

[[op]]
name = "unit.burst_by_buff"
class = "UnitOps"
method = "burst_by_buff"
summary = "把某关键字的叠层换成一笔伤害（读层数→算伤害→改血，全在一个时间片里完成）。"
doc = """
**复合 op 的样板**：Python 侧一次调用，C# 侧完成「读层数 → 夹上限 → 算目标 HP → ChangeHp」。
如果拆成 Python 的多步，中间会被帧边界/其它事件插进来，读到的是旧层数、打到的是旧血量。

返回 `BurstInfo`：`{stacks, damage, hp_before, hp_after, applied}`。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "keyword", type = "buff_keyword", doc = "Buff 关键字，如 \"SINKING\"" },
  { name = "per_stack", type = "int", doc = "每层换多少伤害", default = "3" },
  { name = "max_stacks", type = "int", doc = "参与结算的最大层数", default = "6" },
  { name = "source", type = "source", doc = "伤害来源枚举名", default = "\"PASSIVE\"" },
]
returns = "BurstInfo"
returns_doc = "stacks/damage/hp_before/hp_after/applied"

[[op]]
name = "unit.add_buff"
class = "UnitOps"
method = "add_buff"
summary = "给单位加一个 Buff（实验性：依赖 BuffDetail.AddBuff 的时序语义）。"
doc = """
走游戏自己的 Buff 施加管线（`BuffDetail.AddBuff`），参数按「层数/回合」的直觉给。

**实验性**：真实时序（activeRound、history 列表）在真机上需要验证；失败时返回 False 而不是抛错。
"""
stability = "experimental"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "keyword", type = "buff_keyword", doc = "Buff 关键字" },
  { name = "stacks", type = "int", doc = "层数", default = "1" },
  { name = "turns", type = "int", doc = "回合数", default = "1" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "bool"
returns_doc = "true = 已施加"

# ── 单位状态（一次 crossing 的聚合读）──────────────────────────────────────────────────

[[op]]
name = "unit.state"
class = "UnitOps"
method = "state"
summary = "读单位状态（info 的超集：多带 buff 数量与等级），一次 crossing。"
doc = """
`unit.info` 的加料版：多返回 `buff_count` 与 `level`。仍然是**一次**往返。

为什么不把所有属性都塞进来：每多读一个字段就多一次游戏侧调用。要全景请用 B 层，
这里只收"判断时几乎一定要看"的那几个。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
]
returns = "UnitState"
returns_doc = "info 的全部字段 + buff_count / level"

[[op]]
name = "unit.set_sp"
class = "UnitOps"
method = "set_sp"
summary = "把单位理智（SP/MP）设为某个值，走游戏自己的 ChangeMp。"
doc = """
返回改完之后的 `unit.state`（省一次读）；失败时 `applied=False`。

负数理智表示恐慌计数，`ChangeMp` 接受负值。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "sp", type = "int", doc = "目标理智值（可负）" },
]
returns = "UnitInfo"
returns_doc = "改完之后的状态"

[[op]]
name = "unit.add_shield"
class = "UnitOps"
method = "add_shield"
summary = "给单位加护盾（AddShield）。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "value", type = "int", doc = "护盾值（正数）" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "UnitInfo"
returns_doc = "加完之后的状态"

# ── 速度 / 崩溃 ─────────────────────────────────────────────────────────────────────

[[op]]
name = "unit.set_speed"
class = "UnitOps"
method = "set_speed"
summary = "改单位速度并重算行动顺序（SetSpeed + RefreshSpeed）。"
doc = """
只改值不刷新的话，行动顺序要等下一回合才生效 —— 这个坑在 C# 侧封掉了。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "value", type = "int", doc = "新的速度值" },
]
returns = "UnitInfo"
returns_doc = "改完之后的状态"

[[op]]
name = "unit.refresh_speed"
class = "UnitOps"
method = "refresh_speed"
summary = "只重算速度与行动顺序，不改值。"
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
]
returns = "UnitInfo"

[[op]]
name = "unit.break"
class = "UnitOps"
method = "break_"
summary = "强制让单位进入崩溃（break）状态。"
doc = """
`method = "break_"` 是因为 `break` 是 Python 关键字；C# 侧的方法名由生成器还原成 `Break`。
"""
args = [
  { name = "unit", type = "unit", doc = "目标单位" },
  { name = "timing", type = "timing", doc = "事件时机枚举名", default = "\"ON_SUCCESS_ATTACK\"" },
]
returns = "UnitInfo"
returns_doc = "崩溃之后的状态"

# ── 内容注册（零往返谓词的前提）──────────────────────────────────────────────────────

[[op]]
name = "content.plan"
class = "ContentOps"
method = "plan"
summary = "把一个 mod 关心的 buff 位图计划告诉内核。"
doc = """
注册层用它把「这个 mod 的哪些 buff 要在时点回调里判断」告诉 C#。之后补丁回调里
C# 会按同一份顺序算出 `mask_victim` / `mask_self` 塞进 payload ——
于是 `victim.has(Buff)` 在 Python 侧只是一次整数按位与，**0 次跨进程往返**。

`watch` 的下标就是位序号：`watch[i]` 存在 → 第 i 位为 1。
老内核没有这个 op 时 Python 侧静默跳过，谓词退化为恒假（不报错、不崩）。
"""
args = [
  { name = "mod", type = "str", doc = "模组名（诊断用）" },
  { name = "watch", type = "list_str", doc = "关心的 Buff 关键字，下标即位序号" },
  { name = "hooks", type = "list_obj", doc = "每个时点要哪些位：{timing, victim:[位], self:[位]}" },
]
returns = "bool"
returns_doc = "true = 计划已接受"

[[op]]
name = "content.register"
class = "ContentOps"
method = "register"
summary = "把自定义 Buff 的关键字真注入游戏枚举，并登记图标。"
doc = """
这是自定义 Buff 的入口。它不是"一次 API 调用"就完事 —— 自定义 Buff 是
**三件事的组合**：枚举注入（本 op）、图标补丁（本 op 顺带登记）、本地化（暂未做）。

id 从 **24576（0x6000）** 起、步长 1。为什么不是 Lethe 的 `4097 + 2k`：原版
`BUFF_UNIQUE_KEYWORD` 共 2124 个成员、最大 2123 且就是 `None` 哨兵，1000→2123 密排；
24576 有约 2.2 万个空号，天然跨过哨兵，也能和 Lethe 共存。

幂等；失败返回 false 而**不抛** —— 注入不可用不该让 mod 起不来。
"""
args = [
  { name = "keywords", type = "list_str", doc = "要注入的 Buff 关键字（会做大写规范化）" },
  { name = "icons", type = "list_str", doc = "与 keywords 同序的图标文件名（可空字符串）" },
  { name = "icon_root", type = "str", doc = "图标根目录；空则按相对路径解析", default = "\"\"" },
]
returns = "bool"
returns_doc = "true = 注入成功"

# ======================================================================================
# 时机（hook）：C# 侧在补丁回调里把参数拆成扁平 payload，Python 拿到的是文档化结构。
# `csharp` 段是给 C# 侧的挂点说明；payload 段生成 Python 的 dataclass + on() 的 overload。
#
# ── payload 字段怎么绑定到游戏方法的参数 ───────────────────────────────────────────────
# 每个 payload 字段用 `arg = "<目标方法的参数名>"` 声明来源（**用参数名，不用位置下标**）：
#   * 参数名可以在安装期被校验：名字对不上直接进 problems，而不是静默取错位；
#   * 参数名能唯一定位重载：AccessTools.Method 不传类型时遇同名重载会选错，而 dump.cs 里
#     OnSucceedAttack 有四种签名共存（只有一种在 BattleUnitModel 上）。
# 特殊来源：
#   arg = "self"            → 打补丁的实例（BattleUnitModel 自己）
#   arg = "return"          → 返回值（配合 kind = "prefix_result" 改值）
#   arg = "foo.bar"         → 参数对象上的成员
#   const = <字面量>        → 常量字段
#   static = "Type.Method"  → 无参数来源（例如当前回合数）
# `params` 声明目标方法的完整参数名表，用于安装期与 CI 的签名漂移检测。
# ======================================================================================

[[hook]]
timing = "DamageDealt"
summary = "任意来源的 HP 变化（含非本 mod 造成的）。"
csharp = { target = "BattleUnitModel", method = "OnChangeHp", kind = "postfix" }
params = ["oldHp", "newHp", "dmgSrcType", "timing", "attackerOrNull", "actionOrNull", "keyword"]
payload = [
  { name = "unit", arg = "self", type = "unit", doc = "HP 变化的单位" },
  { name = "attacker", arg = "attackerOrNull", type = "unit", optional = true, doc = "来源单位（可能为空）" },
  { name = "old_hp", arg = "oldHp", type = "int", doc = "变化前 HP" },
  { name = "new_hp", arg = "newHp", type = "int", doc = "变化后 HP" },
  { name = "source", arg = "dmgSrcType", type = "str", doc = "伤害来源枚举名" },
  { name = "timing", arg = "timing", type = "str", doc = "事件时机枚举名" },
  { name = "keyword", arg = "keyword", type = "str", doc = "关联的 Buff 关键字名（可能为空）" },
]

[[hook]]
timing = "AttackSucceeded"
summary = "一次攻击命中结算完成（带伤害分解）。"
csharp = { target = "BattleUnitModel", method = "OnSucceedAttack", kind = "postfix" }
params = ["action", "coin", "target", "finalDmg", "realDmg", "realHpDmg", "isCritical", "isWinDuel", "timing"]
payload = [
  { name = "unit", arg = "self", type = "unit", doc = "攻击方" },
  { name = "target", arg = "target", type = "unit", optional = true, doc = "受击方" },
  { name = "final_damage", arg = "finalDmg", type = "int", doc = "最终伤害" },
  { name = "real_damage", arg = "realDmg", type = "int", doc = "实际伤害" },
