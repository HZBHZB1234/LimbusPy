name: ci

# 只跑"不需要游戏、不需要 C# 构建"的那一层：Python 单测 + 完整示例。
# C# 内核与一致性 harness 需要游戏本体的 interop 程序集，跑不进公共 CI（见 README「从源码构建」）。
on:
  push:
    # 所有分支都跑：分支上先验证，再合进 main，避免"合并后才发现红"。
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]

    # 脚本与测试会打印中文。Windows runner 的 stdout 默认走 cp1252，直接 print 中文会抛
    # UnicodeEncodeError 把作业判红；强制 UTF-8 才能让两边行为一致。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: unit tests
        run: python -m pytest python/tests -q

      # 全部示例（9 场景 / 62 断言），不只是深水区那一个：示例是代码，必须一直被跑。
      - name: examples (end-to-end, mock kernel)
        run: python python/examples/run_examples.py --quiet
